name: Run tests

on:
  push:
    branches:
      - 'main'
      - 'dev'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # The repository's branch ruleset requires the checks "build (3.11)" to
    # "build (3.14)", so keep this `name:` line when the matrix gains more values.
    name: build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-ci.txt
    # tox's `py` environment runs the tests on the Python that runs tox.
    - name: Run tests
      run: tox -e py
    # These checks run once, on the newest Python, so the other jobs do not
    # repeat them.
    - name: Run linters, type checker and coverage
      if: matrix.python-version == '3.14'
      run: tox -e flake8,isort,coverage,mypy,black
